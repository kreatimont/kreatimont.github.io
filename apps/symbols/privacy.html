<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Symbols</title>
  <!-- The Symbols privacy policy moved to the app's own site. GitHub Pages can't send a 301, so this page
       redirects with a canonical, a meta refresh and a script, and keeps a plain link for anything that ignores them. -->
  <link rel="canonical" href="https://symbols-keyboard.app/privacy" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://symbols-keyboard.app/privacy" />
  <script>location.replace("https://symbols-keyboard.app/privacy" + location.hash);</script>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="container" style="padding: 80px 0;">
    <p>The Symbols privacy policy has moved to <a href="https://symbols-keyboard.app/privacy">https://symbols-keyboard.app/privacy</a></p>
  </div>
</body>
</html>
